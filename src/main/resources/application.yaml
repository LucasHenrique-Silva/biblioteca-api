spring:
  profiles:
    active: dev
  application:
    name: biblioteca-api
  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json

logging:
  level:
    com.leiturasaber: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method